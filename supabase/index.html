<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هدرة</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <style>
        /* ═══ Reset & Theme ═══════════════════ */
        :root {
            --primary: #00a884; --bg: #111b21; --panel: #202c33;
            --input: #2a3942; --text: #e9edef; --muted: #8696a0;
            --danger: #ef5350; --sent: #005c4b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg); color:var(--text); height:100%;
            display:flex; justify-content:center; align-items:center;
            overscroll-behavior:none; -webkit-overflow-scrolling:touch;
        }
        .app { width:100%; height:100vh; height:100dvh; background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }
        /* ═══ Name Screen ═════════════════════ */
        #screen {
            position:fixed;inset:0;background:rgba(17,27,33,0.97);
            backdrop-filter:blur(12px);z-index:9999;
            display:flex;align-items:center;justify-content:center;
            overflow-y:auto;padding:16px;
        }
        #screen.hide { display:none; }
        .card {
            background:var(--panel);padding:2.5rem 2rem;border-radius:1rem;
            text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);
            width:90%;max-width:380px;
        }
        .card h1 { font-size:1.5rem; margin:1rem 0 .3rem; }
        .card p { color:var(--muted); font-size:.85rem; margin-bottom:1.5rem; }
        .card input {
            width:100%;padding:12px 16px;border-radius:8px;
            border:1px solid #333;background:var(--input);
            color:#fff;font-size:1rem;text-align:center;outline:none;
            transition:border-color .2s;
        }
        .card input:focus { border-color:var(--primary); }
        .card .colors {
            display:flex;justify-content:center;gap:10px;margin:1rem 0;
        }
        .card .dot {
            width:28px;height:28px;border-radius:50%;cursor:pointer;
            border:3px solid transparent;transition:.2s;
        }
        .card .dot.ok { border-color:#fff; transform:scale(1.15); }
        .card button {
            width:100%;padding:12px;border:none;border-radius:8px;
            background:var(--primary);color:#fff;font-size:1rem;
            font-weight:bold;cursor:pointer;transition:opacity .2s;
        }

        /* ═══ App Layout ══════════════════════ */
        body { overscroll-behavior:none; -webkit-overflow-scrolling:touch; }

        /* ═══ Header ══════════════════════════ */
        header {
            background:var(--panel);padding:10px 16px;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0; gap:8px;
        }
        .hl { display:flex;align-items:center;gap:12px; overflow:hidden; }
        .av {
            width:40px;height:40px;border-radius:50%;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            font-weight:bold;font-size:.9rem;
        }
        .ri { overflow:hidden; }
        .ri h3 { font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ri small { font-size:.75rem; color:var(--muted); }
        .ht { display:flex;align-items:center;gap:4px; flex-shrink:0; }
        .ib {
            background:transparent;border:none;color:var(--muted);
            width:36px;height:36px;border-radius:50%;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:.2s;font-size:1.1rem; flex-shrink:0;
        }
        .ib:hover { background:rgba(255,255,255,.08); color:var(--text); }
        .ib.on { color:var(--primary); background:rgba(0,168,132,.15); }
        .ib.onl { position:relative; }
        .ib.onl .badge {
            position:absolute;top:0;right:0;width:10px;height:10px;
            border-radius:50%;background:#4caf50;
        }
        .ib.onl.has-online .badge { background:#4caf50; }

        /* ═══ Main Layout (Chat + Sidebar) ═══ */
        .main {
            flex:1; display:flex; overflow:hidden;
        }

        /* ═══ Sidebar ════════════════════════ */
        #sidebar {
            width:0; overflow:hidden; transition:width .35s ease;
            background:var(--panel); border-left:1px solid rgba(255,255,255,.05);
            flex-shrink:0; display:flex; flex-direction:column;
        }
        #sidebar.open {
            width:280px; overflow-y:auto; overflow-x:hidden;
        }
        .sb-search {
            width:100%; padding:10px 12px; border:none; outline:none;
            background:transparent; color:var(--text); font-size:.82rem;
            box-sizing:border-box; border-bottom:1px solid rgba(255,255,255,.06);
        }
        .sb-search::placeholder { color:var(--muted); }
        #sidebar .sh {
            padding:12px 16px; font-size:.8rem; font-weight:bold;
            color:var(--muted); border-bottom:1px solid rgba(255,255,255,.05);
            display:flex; align-items:center; gap:8px; flex-shrink:0;
        }
        #sidebar .sh i { font-size:.85rem; }
        #sidebar .sb-search {
            margin:0 12px 8px; padding:10px 14px; border-radius:8px;
            border:none; background:var(--input); color:var(--text);
            font-size:.85rem; outline:none; direction:rtl;
        }
        #sidebar .sb-search::placeholder { color:var(--muted); }
        #sidebar .sb-search:focus { background:#2f3d46; }
        #sidebar .u {
            display:flex; align-items:center; gap:10px;
            padding:10px 16px; cursor:pointer;
            transition:background .15s; position:relative;
        }
        #sidebar .u:hover { background:rgba(255,255,255,.05); }
        #sidebar .u .ud {
            width:40px;height:40px;border-radius:50%;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            font-weight:bold; font-size:.9rem;
        }
        #sidebar .u .uib {
            flex:1;overflow:hidden;display:flex;flex-direction:column;
            gap:2px;min-width:0;
        }
        #sidebar .u .un {
            font-size:.85rem;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap;
        }
        #sidebar .u .ustat { width:8px;height:8px;border-radius:50%;flex-shrink:0; background:#4caf50; }
        #sidebar .u .ubdg {
            position:absolute; top:4px; right:4px;
            background:var(--danger); color:#fff; font-size:.6rem;
            min-width:18px; height:18px; border-radius:9px;
            display:flex;align-items:center;justify-content:center;
            padding:0 5px; font-weight:bold;
        }
        #sidebar .u .dmic {
            font-size:.65rem; color:var(--muted); flex-shrink:0;
            opacity:0; transition:opacity .2s;
        }
        #sidebar .u:hover .dmic { opacity:1; }
        #sidebar .u.me { border-bottom:1px solid rgba(255,255,255,.05); cursor:default; }
        #sidebar .u.me:hover { background:transparent; }
        #sidebar .admin-tag { font-size:.65rem; }
        #sidebar .section-divider {
            display:flex;align-items:center;gap:8px;
            padding:10px 16px 6px;font-size:.7rem;font-weight:bold;
            color:var(--muted);cursor:pointer;user-select:none;
            border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;
        }
        #sidebar .section-divider:hover { color:var(--text); }
        #sidebar .section-divider i { font-size:.65rem; transition:transform .2s; }
        #sidebar .section-divider.collapsed i { transform:rotate(-90deg); }
        #sidebar .section-divider .sd-count {
            font-size:.65rem;background:rgba(255,255,255,.08);
            padding:0 8px;border-radius:8px;color:var(--muted);
        }
        #sidebar .u .uprev {
            font-size:.7rem;color:var(--muted);overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap;direction:rtl;
        }
        #sidebar .u .utime {
            font-size:.6rem;color:var(--muted);flex-shrink:0;direction:ltr;
        }
        #sidebar .dm-empty {
            padding:20px 16px;text-align:center;color:var(--muted);
            font-size:.78rem;line-height:1.5;
        }

        /* ═══ Chat ════════════════════════════ */
        #chat-wrap {
            flex:1; display:flex; flex-direction:column; overflow:hidden;
        }
        #chat {
            flex:1;overflow-y:auto;padding:16px;
            background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode:overlay;background-color:var(--bg);
            display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;
        }

        /* ═══ Scroll-to-bottom Button ═══════ */
        #chat-wrap { position:relative; }
        #scroll-bottom {
            position:absolute;bottom:20px;left:20px;
            width:42px;height:42px;border-radius:50%;
            background:var(--panel);color:var(--text);
            align-items:center;justify-content:center;
            cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);
            z-index:100;transition:transform .15s,opacity .2s;
            opacity:0;
        }
        #scroll-bottom.sb-show { display:flex; opacity:1; }
        #scroll-bottom:hover { transform:scale(1.1); }
        #scroll-bottom:active { transform:scale(.9); }
        #scroll-bottom i { font-size:1.1rem; }
        #sb-count {
            position:absolute;top:-6px;right:-6px;
            min-width:20px;height:20px;border-radius:10px;
            background:var(--primary);color:#fff;
            font-size:.7rem;font-weight:bold;
            display:flex;align-items:center;justify-content:center;
            padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.4);
        }
        .sb-hide { display:none !important; }
        .msg { display:flex; flex-direction:column; max-width:78%; animation:in .25s ease; }
        @keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .msg.se { align-self:flex-start; align-items:flex-start; }
        .msg.re { align-self:flex-end; align-items:flex-end; }
        .msg .nm { font-size:.72rem; font-weight:bold; margin-bottom:2px; padding:0 4px; }
        .msg.re .nm { color:#53bdeb; cursor:pointer; }
        .msg.re .nm:hover { text-decoration:underline; }
        .msg.se .nm { color:#dcf8c6; }
        .msg .bb {
            padding:7px 12px;border-radius:8px;font-size:.95rem;
            line-height:1.5;word-break:break-word;
            box-shadow:0 1px 2px rgba(0,0,0,.2);position:relative;
            display:flex;flex-direction:column;
        }
        .msg.re .bb { background:var(--panel); border-radius:8px 8px 8px 2px; }
        .msg.se .bb { background:var(--sent); border-radius:8px 8px 2px 8px; }
        .msg .bb img { max-width:100%; max-height:300px; border-radius:4px; margin:4px 0; display:block; cursor:pointer; }
        .msg .mt {
            font-size:.6rem; color:rgba(255,255,255,.5);
            display:flex;align-items:center;gap:6px;margin-top:3px;direction:ltr;
        }
        .msg .mt .act {
            background:none;border:none;color:var(--muted);cursor:pointer;
            font-size:.65rem;opacity:.4;transition:.2s;padding:2px;
        }
        .msg .mt .act:hover { opacity:1; color:var(--primary); }
        .msg .mt .act.reply-btn { color:var(--muted); }
        .msg .mt .act.reply-btn:hover { color:#53bdeb; }
        .msg .mt .db { color:var(--danger); }
        .msg .mt .db:hover { opacity:1; transform:scale(1.15); }

        .msg .rxns {
            display:flex;flex-wrap:wrap;align-items:center;gap:3px;
            margin-top:3px;position:relative;
        }
        .msg.re .rxns { justify-content:flex-end; }
        .msg.se .rxns { justify-content:flex-start; }
        .msg .rxn {
            display:inline-flex;align-items:center;gap:2px;
            padding:1px 6px;border-radius:10px;
            background:rgba(255,255,255,.12);cursor:pointer;
            font-size:.68rem;transition:background .15s,transform .1s;
            user-select:none;line-height:1.3;
        }
        .msg .rxn:hover { background:rgba(255,255,255,.22); transform:scale(1.08); }
        .msg .rxn:active { transform:scale(.85); }
        .msg .rxn.rxn-mine { background:rgba(0,168,132,.35); }
        .msg .rxn .rxn-emoji { font-size:.75rem; }
        .msg .rxn .rxn-count { font-size:.6rem; color:rgba(255,255,255,.6); }
        .msg .rxn-add {
            display:inline-flex;align-items:center;justify-content:center;
            width:18px;height:18px;border-radius:50%;
            background:rgba(255,255,255,.08);cursor:pointer;
            font-size:.55rem;color:rgba(255,255,255,.5);transition:.15s;
            border:none;padding:0;line-height:1;
        }
        .msg .rxn-add:hover { background:rgba(255,255,255,.18); color:#fff; }
        .msg .rxn-picker {
            display:none;align-items:center;gap:2px;
            padding:3px 5px;border-radius:16px;
            background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.5);
            position:absolute;z-index:999;top:50%;transform:translateY(-50%);
            white-space:nowrap;
        }
        .msg.re .rxn-picker { right:auto;left:100%;margin-left:4px; }
        .msg.se .rxn-picker { left:auto;right:100%;margin-right:4px; }
        .msg .rxn-picker.open { display:flex; }
        .msg .rxn-picker .rxn.rxn-active {
            background:rgba(83, 189, 235, .25);border-radius:50%;
            outline:2px solid #53bdeb;
        }
        .msg .rxw { position:relative;display:inline-flex; }
        .msg .bb a { color:#53bdeb; text-decoration:underline; }
        .msg .bb-body { flex:1; min-width:0; }
        .msg .edited { font-size:.6rem; color:var(--muted); margin-right:4px; }
        .msg .rqo {
            font-size:.78rem;background:rgba(255,255,255,.06);
            border-right:3px solid var(--primary);
            padding:6px 10px;margin-bottom:4px;border-radius:4px;
        }
        .msg .rqo .rqn { font-weight:bold; color:var(--primary); font-size:.72rem; }
        .msg .rqo .rqt { color:var(--muted); font-size:.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
        .msg .rqo .rqt img { display:none; }
        .msg .room-tag {
            font-size:.6rem;color:var(--muted);background:rgba(255,255,255,.08);
            padding:1px 6px;border-radius:4px;margin-right:4px;
        }

        /* ═══ Loading ═════════════════════════ */
        #loading { display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); gap:8px; }
        .spinner { width:20px;height:20px; border:3px solid var(--panel); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg);} }

        /* ═══ Typing ══════════════════════════ */
        #typing { padding:2px 16px 8px; font-size:.78rem; color:var(--muted); min-height:1.2em; flex-shrink:0; }

        /* ═══ Footer ══════════════════════════ */
        footer {
            background:var(--panel);padding:8px 12px;
            display:flex;align-items:center;gap:6px;flex-shrink:0;
            padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
        }
        .iw {
            flex:1;background:var(--input);border-radius:24px;
            display:flex;align-items:center;padding:0 14px;
        }
        .iw input {
            flex:1;background:transparent;border:none;color:#fff;
            padding:10px 0;outline:none;font-size:.95rem;
        }
        .iw input::placeholder { color:var(--muted); }
        .sb { color:var(--primary); }

        /* ═══ Emoji Picker ════════════════════ */
        #emoji-picker {
            position:absolute;bottom:64px;left:12px;
            background:var(--panel);border-radius:14px;
            padding:14px;box-shadow:0 8px 40px rgba(0,0,0,.6);
            display:none;z-index:500;width:440px;max-width:calc(100vw - 24px);
        }
        #emoji-picker.open { display:block; }
        #emoji-picker .eg {
            display:grid;grid-template-columns:repeat(9,1fr);gap:3px;
            max-height:320px;overflow-y:auto;
        }
        #emoji-picker .eg span {
            font-size:1.8rem;cursor:pointer;text-align:center;
            padding:6px 2px;border-radius:8px;transition:background .15s;
            line-height:1.6;
        }
        #emoji-picker .eg span:hover { background:rgba(255,255,255,.12); }
        #emoji-picker .search-emoji {
            width:100%;padding:8px 12px;margin-bottom:8px;
            border-radius:8px;border:1px solid #444;background:var(--input);
            color:#fff;outline:none;font-size:.9rem;
        }

        /* ═══ GIF Picker ═══════════════════════ */
        #gif-picker {
            position:absolute;bottom:60px;left:12px;
            background:var(--panel);border-radius:12px;
            padding:10px;box-shadow:0 5px 30px rgba(0,0,0,.5);
            display:none;z-index:500;width:420px;max-width:calc(100vw - 24px);
        }
        #gif-picker.open { display:block; }
        #gif-picker .gg {
            display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
            max-height:320px;overflow-y:auto;
        }
        #gif-picker .gg img {
            width:100%;border-radius:8px;cursor:pointer;
            transition:transform .15s;aspect-ratio:1/1;object-fit:cover;
        }
        #gif-picker .gg img:hover { transform:scale(1.05); }
        #gif-picker .search-gif {
            width:100%;padding:6px 10px;margin-bottom:6px;
            border-radius:6px;border:1px solid #333;background:var(--input);
            color:#fff;outline:none;font-size:.85rem;
        }
        #gif-picker .gif-loading {
            text-align:center;color:var(--muted);padding:20px;font-size:.85rem;
        }

        /* ═══ Reply Bar ════════════════════════ */
        #reply-bar {
            background:var(--panel);padding:6px 12px;
            display:none;align-items:center;gap:8px;
            border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;
        }
        #reply-bar.open { display:flex; }
        #reply-bar .rq {
            flex:1;overflow:hidden;
        }
        #reply-bar .rq .rqn {
            font-size:.75rem;color:var(--primary);font-weight:bold;
        }
        #reply-bar .rq .rqt {
            font-size:.8rem;color:var(--muted);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        #reply-bar .rq .rqt img { display:none; }
        #reply-bar .rc {
            background:none;border:none;color:var(--muted);
            cursor:pointer;font-size:1.1rem;padding:4px;
        }
        #reply-bar .rc:hover { color:var(--text); }

        /* ═══ Voice Recording ═══════════════════ */
        #voiceBtn.rec { color:#ef5350 !important; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ═══ Mobile ════════════════════════════ */
        @media (max-width:600px) {
            .msg { max-width:92%; }
            .msg .bb { font-size:1rem; }
            .msg .nm { font-size:.8rem; }
            .msg .rxn { padding:4px 10px; font-size:.8rem; }
            .msg .rxn-add { width:28px;height:28px; font-size:.75rem; }
            .msg .mt .act { font-size:.75rem; padding:6px; }
            .card { width:95%; padding:2rem 1.5rem; }
            .card h1 { font-size:1.2rem; }
            .card .fa-comments { font-size:2rem !important; }
            .card p { margin-bottom:1rem; }
            .card input { padding:12px 14px; font-size:1rem; }
            .card button { padding:12px; }
            .tabc .dot { width:36px;height:36px; }
            .iw input { padding:14px 0; font-size:1rem; }
            .ib { width:42px;height:42px; font-size:1.2rem; }
            #sidebarClose { height:36px !important; font-size:.8rem !important; }
            header { padding:8px 10px; }
            .hl { overflow:visible; }
            #sidebar.open { width:100%; }
            #chat { padding:12px 8px; }
            #emoji-picker { left:6px; right:6px; max-width:calc(100vw - 12px); }
            #gif-picker { left:6px; right:6px; max-width:calc(100vw - 12px); }
            #emoji-picker .eg span { font-size:1.5rem; }
            footer { padding:8px 8px; gap:4px; }
            .main { -webkit-overflow-scrolling:touch; }
            .tabs .tab { font-size:.8rem; padding:6px 12px; }
            #screen { padding:8px; align-items:flex-start; padding-top:10vh; }
            .card { padding:1.5rem 1rem; }
            .card .tabs { margin-bottom:.5rem; }
            * { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        }
        @media (max-width:400px) {
            .msg { max-width:95%; }
            #emoji-picker .eg { grid-template-columns:repeat(7,1fr); }
        }

        /* ═══ Custom Voice Player (Telegram Style) ════ */
        .vp {
            display:flex;align-items:center;gap:8px;
            width:200px;padding:3px 6px 3px 3px;
            border-radius:20px;direction:ltr;
        }
        .vp-play {
            width:32px;height:32px;border-radius:50%;border:none;
            background:var(--primary);color:#fff;
            cursor:pointer;display:flex;align-items:center;
            justify-content:center;font-size:.75rem;flex-shrink:0;
            transition:opacity .2s,transform .12s;
            opacity:.9;
        }
        .vp-play:hover { opacity:1; }
        .vp-play:active { transform:scale(.88); }
        .vp-bar {
            flex:1;height:3px;border-radius:2px;
            background:rgba(255,255,255,.18);cursor:pointer;
            position:relative;overflow:hidden;
        }
        .vp-progress {
            height:100%;border-radius:2px;
            background:var(--primary);width:0%;
            transition:width .2s linear;
        }
        .vp-dur {
            font-size:.65rem;color:rgba(255,255,255,.45);
            min-width:32px;text-align:right;direction:ltr;
            font-variant-numeric:tabular-nums;
        }
        .msg.se .vp-play { background:rgba(255,255,255,.25); }
        .msg.se .vp-progress { background:rgba(255,255,255,.7); }
        .msg.se .vp-bar { background:rgba(255,255,255,.15); }
        .msg.re .vp-play { background:var(--primary); }

            const t = audioCtx.currentTime;
            if(type==='send') {
                osc.frequency.setValueAtTime(660, t);
                gain.gain.setValueAtTime(0.08, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t+0.12);
                osc.start(t); osc.stop(t+0.12);
            } else {
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.setValueAtTime(520, t+0.06);

    function renderOnlineUsers() {
        const me = allUsers.find(u => u.id === userId);
        let others = allUsers.filter(u => u.id !== userId);

        const dmUsers = others.filter(u => lastDmTime[u.id]);
        const restUsers = others.filter(u => !lastDmTime[u.id]);

        dmUsers.sort((a, b) => (lastDmTime[b.id]||0) - (lastDmTime[a.id]||0));
        restUsers.sort((a, b) => (a.username||'').localeCompare(b.username||''));

        const sq = (document.getElementById('dmSearch')?.value||'').trim().toLowerCase();
        const filter = u => !sq || (u.username||'').toLowerCase().includes(sq);

        let html = '';
        // Me
        if(me && !sq) {
            html += `<div class="u me">
                <div class="ud" style="background:${me.color}">${esc(me.username?.charAt(0)||'?')}</div>
                <div class="uib"><div class="un">${esc(me.username)} <span class="admin-tag">${me.is_admin?'👑 آدمين':''}</span></div></div>
                <div class="ustat online"></div>
            </div>`;
        }

        // DMs section
        const filteredDMs = dmUsers.filter(filter);
        if(filteredDMs.length > 0 || sq) {
            if(!sq) html += `<div class="section-divider" data-section="dms"><i class="fas fa-chevron-down"></i> المحادثات <span class="sd-count">${filteredDMs.length}</span></div>`;
            filteredDMs.forEach(u => {
                const initial = (u.username||'?').charAt(0);
                const unread = unreadCounts[u.id] || 0;
                const badge = unread > 0 ? `<span class="ubdg">${unread > 99 ? '99+' : unread}</span>` : '';
                const prev = dmPreview[u.id];

                html += `<div class="u" data-startdm="${u.id}" data-dmname="${esc(u.username||'')}">
                    <div class="ud" style="background:${u.color}">${esc(initial)}</div>
                    <div class="uib">
                        <div class="un">${esc(u.username||'مجهول')} <span class="admin-tag">${u.is_admin?'👑':''}</span></div>

                    </div>
                    ${time ? `<span class="utime">${time}</span>` : ''}

            });

        // Empty state
        if(filteredDMs.length === 0 && !sq) {
            html += `<div class="dm-empty"><i class="fas fa-comment-dots" style="font-size:1.5rem;opacity:.5;margin-bottom:8px;display:block"></i>لا توجد محادثات بعد<br><span style="font-size:.7rem;color:var(--muted)">انقر على مستخدم من القائمة لبدء محادثة</span></div>`;
        }

        // All online users
        if(!sq) {
            const filteredRest = restUsers.filter(filter);
            const collapsed = allOnlineCollapsed ? ' collapsed' : '';
            html += `<div class="section-divider${collapsed}" id="allOnlineToggle"><i class="fas fa-chevron-down"></i> جميع المتصلين <span class="sd-count">${filteredRest.length}</span></div>`;
            if(!allOnlineCollapsed) {
                filteredRest.forEach(u => {
                    const initial = (u.username||'?').charAt(0);
                    html += `<div class="u" data-startdm="${u.id}" data-dmname="${esc(u.username||'')}">
                        <div class="ud" style="background:${u.color}">${esc(initial)}</div>
                        <div class="uib"><div class="un">${esc(u.username||'مجهول')} <span class="admin-tag">${u.is_admin?'👑':''}</span></div></div>
                        <div class="ustat online"></div>

    function formatTime(ts) {
        if(!ts) return '';
        const d = new Date(ts);
        const now = new Date();
        if(d.toDateString() === now.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        const y = new Date(now); y.setDate(y.getDate()-1);
        if(d.toDateString() === y.toDateString()) return 'أمس';
        return d.toLocaleDateString([],{day:'2-digit',month:'2-digit'});
    }

    async function initUnreadFromHistory() {
        if(!sb || !userId) return;
        try {
            // Load last DMs for preview
            const { data: recentMsgs } = await sb
                .from('messages')
                .select('user_id, room, created_at, text')
                .ilike('room', `dm:%${userId}%`)
                .eq('deleted', false)
                .order('created_at', { ascending: false })
                .limit(200);
            if(recentMsgs) {
                const seen = new Set();
                recentMsgs.forEach(m => {
                    const partner = getDmPartner(m.room, userId);
                    if(partner && !seen.has(partner)) {
                        seen.add(partner);
                        lastDmTime[partner] = m.created_at;
                        // Store preview text
                        let prevText = m.text || '';
                        prevText = prevText.replace(/^data:image.*/, '🖼️ صورة');
                        prevText = prevText.replace(/__R\{.*?\}__\|/, '');
                        prevText = prevText.replace(/^https?:\/\/.*giphy\.com\/.*/, '🎞️ GIF');
                        prevText = prevText.replace(/^https?:\/\/.*supabase.*\/voice-messages.*/, '🎤 رسالة صوتية');
                        dmPreview[partner] = { text: prevText, time: m.created_at };
                    }
                });
                renderOnlineUsers();
            }
            // Count unreads
            const { data: unreadMsgs } = await sb
                .from('messages')
                .select('room, user_id')
                .ilike('room', `dm:%${userId}%`)
                .neq('user_id', userId)
                .eq('deleted', false)
                .gte('created_at', lastRead)
                .limit(100);
            if(unreadMsgs) {
                unreadMsgs.forEach(m => {
                    const partner = getDmPartner(m.room, userId);
                    if(partner) {
                        unreadCounts[partner] = (unreadCounts[partner] || 0) + 1;
                    }
                });
            }
        } catch(e) { console.error('initUnreadFromHistory:', e); }
    }

    // ════════════════════════════════════

    // ════════════════════════════════════
    function subscribeRealtime() {
        if(!sb) return;
        subChannel = sb.channel(`msgs-all-${Date.now()}`)
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'messages' },
                (payload) => { handleRealtime(payload); }
            )
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'reactions' },
                (payload) => { handleReactionsRealtime(payload); }
            )
            .subscribe();
    }

    function handleReactionsRealtime(payload) {
        const { eventType, new: n, old: o } = payload;
        const msgId = (n||o)?.message_id;
        if(!msgId) return;
        // Re-fetch this message's reactions and re-render the reactions bar
        sb.from('reactions').select('*').eq('message_id', msgId).then(({data: reactions}) => {
            const msgEl = document.querySelector(`.msg[data-id="${msgId}"]`);
            if(msgEl && reactions) updateReactionsBar(msgEl, reactions);
        }).catch(() => {});
    }

    function handleRealtime(payload) {
        const { eventType, new: n, old: o } = payload;
        switch(eventType) {
            case 'INSERT': {
                const ld=$('loading'); if(ld) ld.remove();
                if(!n) break;
                const isMyMsg = n.user_id === userId;

                // ── DM sidebar tracking (updates even in wrong room) ──
                if(n.room && n.room.startsWith('dm:')) {
                    const partnerId = getDmPartner(n.room, userId);
                    if(partnerId) {
                        lastDmTime[partnerId] = n.created_at || Date.now();
                        // Store preview
                        let prevText = n.text || '';
                        prevText = prevText.replace(/^data:image.*/, '🖼️ صورة');
                        prevText = prevText.replace(/__R\{.*?\}__\|/, '');
                        prevText = prevText.replace(/^https?:\/\/.*giphy\.com\/.*/, '🎞️ GIF');
                        prevText = prevText.replace(/^https?:\/\/.*supabase.*\/voice-messages.*/, '🎤 رسالة صوتية');
                        dmPreview[partnerId] = { text: prevText, time: n.created_at || Date.now() };
                        if(!isMyMsg) {
                            unreadCounts[partnerId] = (unreadCounts[partnerId] || 0) + 1;
                            // Auto-open sidebar on incoming DM
                            sidebar.classList.add('open');
                        }
                        debouncedRenderUsers();
                    }
                }

                // ── Render if matches current room ──
                if(n.room === currentRoom) {
                    if(isMyMsg) {
                        const tempEl = chat.querySelector('[data-id^="temp_"]');
                        if(tempEl) {
                            tempEl.setAttribute('data-id', n.id);
                            const editBtn = tempEl.querySelector('[data-edit^="temp_"]');
                            if(editBtn) editBtn.setAttribute('data-edit', n.id);
                            const delBtn = tempEl.querySelector('[data-del^="temp_"]');
                            if(delBtn) delBtn.setAttribute('data-del', n.id);
                        }
                    } else {
                        // Look up profile locally instead of API call
                        const profile = allUsers.find(u => u.id === n.user_id);
                        n.is_admin = profile?.is_admin || false;
                        renderMessage(n);
                        scrollDown();
                        playSound('receive');
                        // If still not near bottom, show badge
                        if(!isNearBottom()) {
                            newWhileUp++;
                            sbCount.textContent = newWhileUp;
                            sbCount.classList.remove('sb-hide');
                            sbBtn.classList.add('sb-show');
                        }
                    }
                }
                break;
            }
            case 'UPDATE': {
                if(n && n.room === currentRoom) {
                    const el = document.querySelector(`[data-id="${n.id}"]`);
                    if(el) {
                        if(n.deleted) { el.remove(); }
                        else { updateMessageEl(el, n); }
                    }
                }
                break;
            }
            case 'DELETE': {
                const el = document.querySelector(`[data-id="${(o||n).id}"]`);
                if(el) el.remove();
                break;
            }
        }
    }

    function updateMessageEl(el, data) {
        const bubble = el.querySelector('.bb');
        if(!bubble) return;
        // Save meta (time + edit/delete buttons with their event listeners)
        const meta = bubble.querySelector('.mt');
        const isImg = data.text && data.text.startsWith('data:image');
        if(isImg) {
            bubble.innerHTML = `<img src="${esc(data.text)}" onclick="window.open('${esc(data.text)}')" loading="lazy">`;
        } else {
            bubble.innerHTML = linkify(data.text||'');
        }
        // Re-append meta so buttons + event listeners survive
        if(meta) bubble.appendChild(meta);
        // Add edited indicator
        if(data.edited_at) {
            if(!meta.querySelector('.edited')) {
                const ed = document.createElement('span');
                ed.className = 'edited';
                ed.textContent = '· معدلة';
                meta.insertBefore(ed, meta.firstChild);
            }
        }
    }

    function buildReactionsHtml(reactions) {
        if (!reactions || reactions.length === 0) return '';
        const map = {};
        reactions.forEach(r => {
            if (!map[r.emoji]) map[r.emoji] = { count: 0, mine: false };
            map[r.emoji].count++;
            if (r.user_id === userId) map[r.emoji].mine = true;
        });
        return Object.entries(map).map(([emoji, info]) =>
            `<span class="rxn${info.mine ? ' rxn-mine' : ''}" data-emoji="${esc(emoji)}"><span class="rxn-emoji">${emoji}</span><span class="rxn-count">${info.count}</span></span>`
        ).join('');
    }

    function updateReactionsBar(msgEl, reactions) {
        const rxnsEl = msgEl.querySelector('.rxns');
        if(!rxnsEl) return;
        const rw = rxnsEl.querySelector('.rxw');
        const html = buildReactionsHtml(reactions) || '';
        // Remove old badges (keep .rxw)
        Array.from(rxnsEl.children).forEach(child => {
            if(child !== rw) {
                if(child.matches && child.matches('.rxn[data-emoji]')) child.remove();
            }
        });
        // Insert new badges before .rxw
        const temp = document.createElement('span');
        temp.innerHTML = html;
        Array.from(temp.children).forEach(badge => rxnsEl.insertBefore(badge, rw));
    }

    async function toggleReaction(msgId, emoji) {
        if(!sb || !userId) return;
        try {
            const { data: existing } = await sb.from('reactions')
                .select('id,emoji').eq('message_id', msgId)
                .eq('user_id', userId).maybeSingle();
            if(existing) {
                if(existing.emoji === emoji) {
                    // Same emoji → remove (toggle off)
                    await sb.from('reactions').delete().eq('id', existing.id);
                } else {
                    // Different emoji → replace (delete old + insert new, more reliable than update)
                    await sb.from('reactions').delete().eq('id', existing.id);
                    await sb.from('reactions').insert({ message_id: msgId, user_id: userId, emoji });
                }
            } else {
                await sb.from('reactions').insert({ message_id: msgId, user_id: userId, emoji });
            }
            // Immediate UI update (don't wait for realtime)
            const msgEl = document.querySelector(`.msg[data-id="${msgId}"]`);
            if(msgEl) {
                const { data: reactions } = await sb.from('reactions').select('*').eq('message_id', msgId);
                if(reactions) updateReactionsBar(msgEl, reactions);
            }
        } catch(e) { toast('فشل التفاعل: ' + e.message); }
    }

    function renderMessage(msg) {
        const isMe = msg.user_id === userId;
        const bc = isMe ? (msg.color||myColor) : (msg.color||'#202c33');
        const align = isMe ? 'se' : 're';

        const div = document.createElement('div');
        div.className = `msg ${align}`;
        div.setAttribute('data-id', msg.id);

        const isGif = msg.text && (msg.text.startsWith('https://') || msg.text.startsWith('http://')) && (msg.text.includes('giphy.com') || msg.text.endsWith('.gif'));
        const isImg = !isGif && msg.text && msg.text.startsWith('data:image');
        const bstyle = !isMe ? ` style="background:${bc}"` : '';

        // ── Reply Quote (from embedded text) ──
        let replyHtml = '';
        let replyData = null;
        let actualText = msg.text || '';
        if(actualText.startsWith('__R')) {
            const end = actualText.indexOf('__|');
            if(end > 3) {
                try { replyData = JSON.parse(actualText.substring(3, end)); } catch(e) {}
                if(replyData && replyData.un) actualText = actualText.substring(end + 3);
                else { replyData = null; actualText = msg.text || ''; }
            }
        }
        const isGif2 = actualText && (actualText.startsWith('https://') || actualText.startsWith('http://')) && (actualText.includes('giphy.com') || actualText.endsWith('.gif'));
        const isAudio2 = actualText && actualText.includes('/storage/v1/object/public/voice-messages/');

        if(replyData && replyData.un) {
            const rt = replyData.txt ? replyData.txt.replace(/^data:image.*/, '🖼️ صورة').replace(/^https?:\/\/.*giphy\.com\/.*/, '🎞️ GIF').substring(0, 60) : '';

        else if(isAudio2) body = `<div class="vp"><button class="vp-play" data-src="${esc(actualText)}"><i class="fas fa-play"></i></button><div class="vp-bar"><div class="vp-progress"></div></div><span class="vp-dur">0:00</span></div>`;

        const time = msg.created_at

            actions += `<button class="act admin-del" data-admin-del="${msg.id}" title="حذف (آدمين)"><i class="fas fa-trash"></i></button>`;
        }

        const edited = msg.edited_at ? '<span class="edited">· معدلة</span>' : '';
        const senderName = msg.user_name || 'مجهول';
        const adminBadge = msg.is_admin ? '<span class="admin-badge">👑</span>' : '';

        const rxnsAdd = `<button class="rxn-add" title="تفاعل">+</button>`;
        div.innerHTML = `
            <span class="nm">${esc(senderName)}${adminBadge}</span>
            <div class="bb"${bstyle}>
                <div class="bb-body">
                    ${replyHtml}
                    ${body}
                    <div class="mt">${edited}<span>${time}</span>${actions}</div>
                </div>
                <div class="rxns" data-msg-id="${msg.id}">
                    ${buildReactionsHtml(msg.reactions)}
                    <span class="rxw">
                        ${rxnsAdd}
                        <div class="rxn-picker">
                            ${REACT_EMOJIS.map(e => `<span class="rxn" data-emoji="${e}">${e}</span>`).join('')}

    async function sendText() {
        const text = mi.value.trim();
        if(!text) return;
        if(text.length > 10000) { toast('الرسالة طويلة جداً'); return; }

        const msg = { text, user_id:userId, user_name:myName, color:myColor, room:currentRoom, created_at:Date.now(), deleted:false, is_admin: isAdmin };
        if(replyTo) { msg.text = `__R${JSON.stringify({id:replyTo.id,un:replyTo.user_name,txt:replyTo.text})}__|${msg.text}`; cancelReply(); }
        mi.value = ''; saveDraft();

        // Optimistic render (appears immediately)
        const tempId = 'temp_' + Date.now();
        msg.id = tempId;            // ← _tempId → id
        renderMessage(msg);
        scrollDown(true);
        playSound('send');

        try {
            const { data, error } = await sb.from('messages').insert({
                text: msg.text, user_id: msg.user_id, user_name: msg.user_name,
                color: msg.color, room: msg.room, created_at: msg.created_at, deleted: msg.deleted
            }).select();
            if(error) throw error;
            // Replace temp ID with real DB ID so delete/edit work immediately
            if(data && data[0] && data[0].id) {
                const realId = data[0].id;
                const el = chat.querySelector(`[data-id="${tempId}"]`);
                if(el) {
                    el.setAttribute('data-id', realId);
                    el.querySelector('[data-edit]')?.setAttribute('data-edit', realId);
                    el.querySelector('[data-del]')?.setAttribute('data-del', realId);
                }
                myMessages.delete(tempId);
                myMessages.add(realId);
            }
        } catch(e) {
            toast('فشل الإرسال: ' + e.message);
        }
    }

    // ════════════════════════════════════
    // 🎵  Custom Voice Player
    // ════════════════════════════════════
    let currentAudio = null;

    document.addEventListener('click', (e) => {
        // ── Play/Pause ──
        const playBtn = e.target.closest('.vp-play');
        if(playBtn) {
            const vp = playBtn.closest('.vp');
            const bar = vp.querySelector('.vp-bar .vp-progress');
            const dur = vp.querySelector('.vp-dur');
            const src = playBtn.dataset.src;

            // If same audio, toggle pause
            if(currentAudio && currentAudio.dataset.src === src) {
                if(!currentAudio.paused) {
                    currentAudio.pause();
                    playBtn.classList.remove('playing');
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                } else {
                    currentAudio.play();
                    playBtn.classList.add('playing');
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }
                return;
            }

            // Stop previous
            if(currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                document.querySelectorAll('.vp-play.playing').forEach(b => {
                    b.classList.remove('playing');
                    b.innerHTML = '<i class="fas fa-play"></i>';
                });
            }

            // Play new
            const audio = new Audio(src);
            audio.dataset.src = src;
            currentAudio = audio;
            audio.play();
            playBtn.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';

            audio.addEventListener('loadedmetadata', () => {
                if(!audio.paused) {
                    const m = Math.floor((audio.duration||0)/60);
                    const s = Math.floor((audio.duration||0)%60);
                    dur.textContent = (m||'0')+':'+(s<10?'0':'')+(s||'0');
                }
            });

            audio.addEventListener('timeupdate', () => {
                if(audio.duration) {
                    const pct = (audio.currentTime/audio.duration)*100;
                    bar.style.width = pct+'%';
                    const m = Math.floor(audio.currentTime/60);
                    const s = Math.floor(audio.currentTime%60);
                    dur.textContent = (m||'0')+':'+(s<10?'0':'')+(s||'0');
                }
            });

            audio.addEventListener('ended', () => {
                playBtn.classList.remove('playing');
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                bar.style.width = '0%';
                if(audio.duration) {
                    const m = Math.floor(audio.duration/60);
                    const s = Math.floor(audio.duration%60);
                    dur.textContent = (m||'0')+':'+(s<10?'0':'')+(s||'0');
                }
                currentAudio = null;
            });
            return;
        }

        // ── Seek on progress bar ──
        const seekBar = e.target.closest('.vp-bar');
        if(seekBar && currentAudio && !currentAudio.paused) {
            const rect = seekBar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left)/rect.width));
            if(currentAudio.duration) {
                currentAudio.currentTime = pct * currentAudio.duration;
            }
        }
    });

    // ════════════════════════════════════
    // ❤️  HEARTBEAT — refresh users list
    // ════════════════════════════════════
    let _lastLoad = 0;

    setInterval(async () => {
        if(Date.now() - _lastLoad > 25000) { _lastLoad = Date.now(); loadUsers(); }
    }, 30000);

    document.addEventListener('visibilitychange', () => {
        if(!document.hidden && Date.now() - _lastLoad > 10000) {
            _lastLoad = Date.now();
            loadUsers();
        }
    });

    // ════════════════════════════════════
    // 🔁  AUTO-LOGIN from localStorage
    // ════════════════════════════════════
    (async function autoLogin() {
        const savedId = localStorage.getItem(KEYS.uid);
        const savedName = localStorage.getItem(KEYS.name);
        if(!savedId || !savedName) return;
        if(!initSupabase()) return;
        const { data } = await sb.from('profiles')
            .select('id, username, color, is_admin')
            .eq('id', savedId)
            .eq('username', savedName)
            .maybeSingle();
        if(data) {
            const savedLastRead = localStorage.getItem(KEYS.lastRead);
            lastRead = savedLastRead ? Number(savedLastRead) : Date.now();
            await joinChat(data);
        } else {
            // User deleted or renamed — clear saved session
            ['uid','name','color','admin','lastRead'].forEach(k => {
                try { localStorage.removeItem(KEYS[k]); } catch {}
            });
        }
    })();

})();
</script>
</body>
</html>
